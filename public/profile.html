<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILKFACTORY - главная</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a class="logo-contain" href="index.html"><img src="img/logo.png" alt="логотип" class="logo"></a>
        <a class="back-contain" href="index.html"><img src="img/icons/logo_tel.png" alt="логотип" class="back"></a>
        <nav>
            <ul>
                <li><a href="service.html">услуги</a></li>
                <li><a href="catalog.html">каталог</a></li>
                <li><a href="profile.html"><img src="img/icons/profile.png" alt="профиль" class="icon"></a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="description_user--sec">
            <div class="description_user--div">
                <div class="visul_part">
                    <h2 class="user_title">никнейм</h2>
                    <div class="buttons_change-profiles">
                        <button class="exit_user--button">выйти</button>
                        <button class="delete_user--button">удалить</button>
                        <button class="change_user--button">изменить</button>
                    </div>
                </div>
                <div class="main_part">
                    <p class="user_info adress">адрес: ул. колотушкино д. 15/2 </p>
                    <p class="user_info tel">телефон: 89010870363</p>
                    <p class="user_info mail">почта: email@emaul.ru</p>
                </div>
            </div>
            <button class="view_orders--button">просмотреть записи</button>
        </section>
        <section class="favorites_user--sec">
            <button class="favorites--button"><img src="img/icons/arrow_2.png" alt="назад"></button>
            <div class="favorites-div">
                <div class="title_div--favorites">
                    <button class="button--catalog_tel"><img src="img/icons/arrow_2.png" alt=""></button>
                    <h2 class="title_favorites">любимое</h2>
                    <button class="button--catalog_tel reverse"><img src="img/icons/arrow_2.png" alt=""></button>
                </div>
                <div class="favorites-div--main">
                    <div class="product_cart">
                        <img src="img\products\main_image_1.png" alt="" class="img_product--catalog">
                        <h4 class="product_title--catalog">шоколад не белый от блалаал</h4>
                        <p class="product_price--catalog">1800р.</p>
                        <div class="buttons_product--catalog">
                            <button class="button--catalog"><img class="img_cart--catalog" src="img/icons/cart.png" alt=""></button>
                            <button class="button--catalog"><img class="img_favorit--catalog" src="img/icons/favourite.png" alt=""></button>
                        </div>
                    </div>
                </div>
            </div>
            <button class="favorites--button reverse"><img src="img/icons/arrow_2.png" alt="вперед"></button>
        </section>
        <section class="basket_user--sec">
            <div class="basket"></div>
            <div class="change_basket">
                <button class="clear_basket">очистить</button>
                <p class="price_basket">465руб.</p>
                <button class="buy_basket">купить</button>
            </div>
        </section>
    </main>
    <footer>
        <nav>
            <ul>
                <li><a>89010870363</a></li>
                <li><a>MILK@mail.ru</a></li>
                <li><a><img src="img/icons/vk.png" alt="вк" class="icon"></a></li>
                <li><a><img src="img/icons/tg.png" alt="телеграмм" class="icon"></a></li>
                <li class="protected"><a>все права защищены</a></li>
            </ul>
        </nav>
    </footer>
</body>
</html>
